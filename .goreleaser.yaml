# GoReleaser configuration for WaxTap. Validate with `goreleaser check`.
# Builds are pure Go (CGO disabled); release with `git tag vX.Y.Z && git push --tags`
# (the release workflow runs goreleaser) or locally with `goreleaser release --clean`.
version: 2

project_name: waxtap

before:
  hooks:
    - go mod tidy
    # A stale THIRD-PARTY-NOTICES.md fails the release rather than shipping
    # under an immutable tag; regenerate with go run ./internal/notices/gen.
    - go test ./internal/notices -run TestCheckedInFileIsCurrent -count=1

builds:
  - id: waxtap
    main: ./cmd/waxtap
    binary: waxtap
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # main.version is the var the version subcommand reads; injecting it here
    # makes release binaries report their tag even without module build info.
    # Keep the v: .Version strips it, but version.go documents -X main.version=v1.2.3
    # and the build-info fallback yields v3.2.0, so a bare 3.2.0 would make the same
    # command answer differently depending on how the binary was obtained.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: waxtap
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      # The licenses of every module compiled into the binary; generated, see
      # internal/notices.
      - THIRD-PARTY-NOTICES.md
      - MAINTENANCE.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Release notes are hand-written on the draft before publishing.
  disable: true

release:
  draft: true
  prerelease: auto
