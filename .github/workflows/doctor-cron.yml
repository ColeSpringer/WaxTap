name: doctor

# Daily extraction health check: build the CLI and run `waxtap doctor`, which
# extracts a known-good video, resolves its best audio, and reads a few KiB to
# prove byte delivery. It is an early-warning signal for YouTube-side breakage
# and doubles as a container healthcheck reference.
#
# Tolerance: GitHub-hosted runner IPs are routinely bot-walled or throttled by
# YouTube, so environmental failures (login required, availability, rate
# limiting) only warn and keep the job green. Only an extraction failure (exit
# code 4: stale parser, cipher solve, extraction; the class that means *our*
# code needs updating) fails the job so it surfaces loudly, and the verdict
# reads every candidate of every attempt for that class, not just the last
# exit code. Each run's summary page carries the verdict and the report.

on:
  schedule:
    - cron: "17 7 * * *" # daily, ~07:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Download a whole track (doctor --full) instead of a small range"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o waxtap ./cmd/waxtap

      - name: run doctor
        id: doctor
        env:
          # Empty on the schedule; the manual trigger can ask for a full download.
          FULL: ${{ inputs.full && '--full' || '' }}
        run: |
          # Up to three attempts with a growing pause between them. Exit 4 is
          # not retried: it is the alarm, and a retry only delays it. Each
          # attempt keeps its own report so the verdict can read them all.
          for attempt in 1 2 3; do
            echo "doctor attempt $attempt"
            if ./waxtap doctor --json $FULL > "doctor-$attempt.json"; then status=0; else status=$?; fi
            cat "doctor-$attempt.json"
            case "$status" in 0|4) break ;; esac
            if [ "$attempt" -lt 3 ]; then
              echo "attempt $attempt: doctor exited $status; backing off"
              sleep $((attempt * 30))
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: verdict
        # Runs after a timeout or cancellation too, so the summary always says
        # what happened.
        if: always()
        env:
          STATUS: ${{ steps.doctor.outputs.status }}
        run: |
          # The reports that parse, oldest first. A killed attempt leaves a
          # partial file, which is ignored rather than trusted.
          attempts=0
          reports=()
          for f in doctor-[1-3].json; do
            [ -e "$f" ] || continue
            attempts=$((attempts + 1))
            if jq -e . "$f" >/dev/null 2>&1; then reports+=("$f"); fi
          done

          # The exit code speaks for the last candidate of the last attempt.
          # An extraction failure on any candidate of any attempt is the alarm
          # even when a later candidate was merely bot-walled, so every report
          # is read for the three codes classifyError (cmd/waxtap/output.go)
          # maps to exit 4.
          alarm=""
          if [ "${#reports[@]}" -gt 0 ]; then
            alarm=$(jq -r '
              [.attempts[]?.error.code, .error.code] | .[]
              | select(. == "stale-parser" or . == "cipher-solve" or . == "extraction-failed")
              | "\(.) in \(input_filename)"
            ' "${reports[@]}" | sort -u | paste -sd ';' - | sed 's/;/; /g')
          fi

          fail=0
          if [ "$STATUS" = 4 ] || [ -n "$alarm" ]; then
            verdict="extraction failure (${alarm:-exit 4})"
            echo "::error::doctor reports an extraction failure (${alarm:-exit 4}): YouTube likely changed something WaxTap must fix (see MAINTENANCE.md)"
            fail=1
          elif [ "$STATUS" = 0 ]; then
            verdict="healthy"
            echo "healthy"
          elif [ -z "$STATUS" ]; then
            verdict="did not finish (timed out or cancelled)"
            echo "::warning::doctor did not finish"
          else
            verdict="not healthy (exit $STATUS), treated as environmental"
            echo "::warning::doctor did not report healthy (exit $STATUS); treating as environmental (GitHub-IP bot wall, rate limiting, availability) and not failing the job"
          fi

          # The verdict, one line per outcome, and the last complete report.
          {
            echo "## doctor: $verdict"
            echo
            echo "- attempts: $attempts"
            if [ "${#reports[@]}" -gt 0 ]; then
              last="${reports[-1]}"
              jq -r '
                (if .videoId != null then "- delivered \(.videoId): itag \(.itag // 0), \(.bytes // 0) bytes, \(if .fullDownload then "full download" else "range read" end)" else empty end),
                (.attempts[]? | "- \(.videoId): \(.error.code)"),
                (.sidecars[]? | "- sidecar \(.endpoint): " + (
                  if .ok then "ok, \(.latencyMs) ms" + (if .verdict != null then ", reported \(.verdict) for the probed video" else "" end)
                  else "\(.error.code): \(.error.message)" + (if .retryAfterSeconds > 0 then "; retry in \(.retryAfterSeconds)s" else "" end) end)),
                (if .note != null then "- note: \(.note)" else empty end),
                (if .error != null then "- error: \(.error.code): \(.error.message)" else empty end)
              ' "$last"
              echo
              echo "<details><summary>$last</summary>"
              echo
              echo '```json'
              jq . "$last"
              echo '```'
              echo "</details>"
            else
              echo "- no complete report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"
