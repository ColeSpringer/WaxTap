name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull-request branch cancels the run it supersedes. A push to main
# is a group of its own, so every commit there runs to a verdict instead of
# replacing a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  test:
    # The release ships all three operating systems. Only a run there executes
    # the Windows-only implementations (file locking, temp-file modes, umask)
    # or meets macOS's filesystem, case-insensitive and with the temp
    # directory behind a symlink.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test (race, shuffled)
        # Shuffled so a test that leans on the order of another runs into it here
        # rather than in a rewrite months later.
        run: go test -race -shuffle=on ./...

  release-dry-run:
    # The GoReleaser run the release workflow performs on a tag, as a snapshot:
    # every release target builds, the archives assemble, and the before-hooks
    # in .goreleaser.yaml pass, so a tag push is not the first time the build
    # side of the configuration is exercised. Publishing and the attestation
    # only run on the tag.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser versions the snapshot from the latest tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --snapshot --clean
